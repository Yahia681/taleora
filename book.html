<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Taleora | تفاصيل الرواية</title>

<style>

:root{
  --bg:#100d0b;
  --card:#191411;
  --gold:#d9a45e;
  --gold2:#f0c982;
  --text:#fff8ef;
  --muted:#b9aa9b;
  --line:#ffffff12;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 6%;
  border-bottom:1px solid var(--line);
  background:#100d0bed;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:var(--gold2);
  font-size:23px;
  font-weight:900;
}

.logo small{
  display:block;
  color:white;
  font-size:8px;
  letter-spacing:5px;
  text-align:center;
}

.back{
  border:1px solid var(--line);
  background:#ffffff08;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

/* BOOK PAGE */

.book-page{
  width:90%;
  max-width:1100px;
  margin:60px auto;
}

.book-details{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:45px;
  align-items:start;
}

.cover{
  height:430px;
  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  padding:25px;

  font-size:25px;
  font-weight:900;

  background:
    radial-gradient(
      circle at 30% 20%,
      #52717c,
      #162329 65%
    );

  border:1px solid #ffffff15;
}

.info h1{
  font-size:42px;
  margin:0 0 15px;
}

.author{
  color:var(--gold2);
  font-size:16px;
  margin-bottom:20px;
}

.category{
  display:inline-block;
  padding:7px 13px;
  border-radius:20px;
  background:#ffffff0c;
  color:var(--gold2);
  font-size:13px;
  margin-bottom:25px;
}

.description{
  color:var(--muted);
  line-height:2;
  font-size:16px;
}

.price{
  color:var(--gold2);
  font-size:25px;
  font-weight:900;
  margin:25px 0;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 24px;
  cursor:pointer;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:#24170d;
}

.btn.secondary{
  background:#ffffff0c;
  color:white;
  border:1px solid var(--line);
}

.message{
  margin-top:25px;
  color:var(--gold2);
  min-height:25px;
}

/* FOOTER */

footer{
  margin-top:100px;
  padding:35px;
  text-align:center;
  border-top:1px solid var(--line);
  color:var(--muted);
}

/* MOBILE */

@media(max-width:700px){

  .book-details{
    grid-template-columns:1fr;
  }

  .cover{
    height:360px;
    max-width:280px;
    margin:auto;
  }

  .info h1{
    font-size:31px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">

رواية حكاية

<small>
TALEORA
</small>

</div>

<button
class="back"
onclick="goHome()"
>
← العودة للرئيسية
</button>

</header>


<!-- BOOK DETAILS -->

<main class="book-page">

<div class="book-details">

<div
class="cover"
id="cover"
>
جاري التحميل...
</div>


<div class="info">

<h1 id="title">
جاري التحميل...
</h1>

<div
class="author"
id="author"
>
</div>

<div
class="category"
id="category"
>
</div>

<p
class="description"
id="description"
>
</p>

<div
class="price"
id="price"
>
</div>

<div class="buttons">

<button
class="btn"
onclick="startReading()"
>
📖 ابدأ القراءة
</button>

<button
class="btn secondary"
onclick="addFavorite()"
>
❤️ أضف للمفضلة
</button>

</div>

<div
class="message"
id="message"
>
</div>

</div>

</div>

</main>


<!-- FOOTER -->

<footer>

<strong style="color:#e8b56e">
Taleora
</strong>

<br><br>

عالمك بين صفحات الحكايات © 2026

</footer>


<script>

/* =========================
   بيانات الروايات
========================= */

const books = [

{
id:1,
title:"ألف شمس ساطعة",
author:"خالد حسيني",
price:190,
category:"رومانسية",
description:
"رواية إنسانية تدور حول حياة مليئة بالتحديات والعلاقات والاختيارات الصعبة."
},

{
id:2,
title:"خريف البراءة",
author:"أحمد مراد",
price:200,
category:"غموض",
description:
"حكاية مليئة بالأسرار والأسئلة التي تقود القارئ لاكتشاف ما وراء الأحداث."
},

{
id:3,
title:"الرحلة",
author:"باسم خندقجي",
price:170,
category:"مغامرة",
description:
"رحلة مليئة بالمفاجآت والاكتشافات، حيث تتغير الأحداث مع كل خطوة."
},

{
id:4,
title:"قواعد العشق الأربعون",
author:"إليف شافاق",
price:210,
category:"رومانسية",
description:
"حكاية تجمع بين الحب والتغيير واكتشاف الذات."
},

{
id:5,
title:"عندما يعزف الشيطان",
author:"منى الشاذلي",
price:180,
category:"رعب",
description:
"حكاية غامضة بأجواء مظلمة وأحداث تثير الفضول."
},

{
id:6,
title:"ليلة لا تنتهي",
author:"محمد صادق",
price:199,
category:"غموض",
description:
"ليلة استثنائية تبدأ بأحداث بسيطة ثم تتحول إلى سلسلة من الأسرار."
},

{
id:7,
title:"1984",
author:"جورج أورويل",
price:160,
category:"كلاسيكيات",
description:
"رواية كلاسيكية عن عالم تتحكم فيه السلطة والمراقبة بشكل واسع."
},

{
id:8,
title:"مئة عام من العزلة",
author:"غابرييل غارسيا ماركيز",
price:220,
category:"كلاسيكيات",
description:
"حكاية عائلة وأجيال متعاقبة في عالم مليء بالأحداث والخيال."
},

{
id:9,
title:"الحصان الأسود",
author:"أحمد خالد توفيق",
price:150,
category:"غموض",
description:
"قصة مليئة بالأفكار والأحداث الغامضة التي تدفعك لمتابعة النهاية."
},

{
id:10,
title:"الأمير الصغير",
author:"أنطوان دو سانت",
price:140,
category:"فانتازيا",
description:
"رحلة خيالية تحمل أفكارًا عن الحياة والصداقة والنظر إلى العالم."
},

{
id:11,
title:"تذكرة إلى سرمد",
author:"أحمد مراد",
price:190,
category:"مغامرة",
description:
"رحلة مختلفة تجمع بين المغامرة والأسرار."
},

{
id:12,
title:"رجال في الشمس",
author:"غسان كنفاني",
price:120,
category:"كلاسيكيات",
description:
"رواية أدبية قصيرة تتناول رحلة مجموعة من الشخصيات وظروفها الصعبة."
}

];


/* =========================
   قراءة ID من الرابط
========================= */

const params =
new URLSearchParams(
window.location.search
);

const id =
Number(params.get("id"));


/* =========================
   البحث عن الرواية
========================= */

const book =
books.find(
item => item.id === id
);


/* =========================
   عرض الرواية
========================= */

if(book){

document.getElementById("title")
.textContent =
book.title;

document.getElementById("author")
.textContent =
"✍️ " + book.author;

document.getElementById("category")
.textContent =
"📚 " + book.category;

document.getElementById("description")
.textContent =
book.description;

document.getElementById("price")
.textContent =
book.price + " جنيه";

document.getElementById("cover")
.textContent =
book.title;

}

else{

document.getElementById("title")
.textContent =
"الرواية غير موجودة";

document.getElementById("description")
.textContent =
"لم نتمكن من العثور على الرواية المطلوبة.";

}


/* =========================
   العودة للرئيسية
========================= */

function goHome(){

window.location.href =
"index.html";

}


/* =========================
   بدء القراءة
========================= */

function startReading(){

if(!book){
return;
}

window.location.href =
"reader.html?id=" + book.id;

}


/* =========================
   إضافة للمفضلة
========================= */

function addFavorite(){

if(!book){
return;
}

let favorites =
JSON.parse(
localStorage.getItem("favorites")
) || [];


if(
!favorites.includes(book.id)
){

favorites.push(book.id);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

document.getElementById("message")
.textContent =
"❤️ تمت إضافة الرواية إلى المفضلة";

}

else{

document.getElementById("message")
.textContent =
"الرواية موجودة بالفعل في المفضلة ❤️";

}

}

</script>

</body>
</html>
