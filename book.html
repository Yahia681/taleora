<!doctype html>

<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Taleora | تفاصيل الرواية</title><style>

:root{
  --bg:#100d0b;
  --card:#191411;
  --gold:#d9a45e;
  --gold2:#f0c982;
  --text:#fff8ef;
  --muted:#b9aa9b;
  --line:#ffffff12;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 80% 10%,
      #70452555,
      transparent 35%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Tahoma,
    Arial,
    sans-serif;

  min-height:100vh;
}


/* HEADER */

header{
  position:sticky;

  top:0;

  z-index:50;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:14px 6%;

  background:#100d0bed;

  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:23px;

  font-weight:900;

  color:var(--gold2);
}

.logo small{
  display:block;

  font-size:8px;

  letter-spacing:5px;

  text-align:center;

  color:white;
}

.back{
  border:1px solid var(--line);

  background:#ffffff0c;

  color:white;

  padding:9px 15px;

  border-radius:10px;

  cursor:pointer;
}


/* MAIN */

.container{
  width:90%;

  max-width:1050px;

  margin:55px auto 90px;
}


/* BOOK */

.book-details{

  display:grid;

  grid-template-columns:
    320px
    1fr;

  gap:45px;

  align-items:start;
}


/* COVER */

.cover{

  height:470px;

  border-radius:18px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 30% 20%,
      #52717c,
      #162329 65%
    );

  border:1px solid var(--line);

  box-shadow:
    0 20px 50px #0008;
}

.cover img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;
}


/* INFO */

.category{

  display:inline-block;

  color:var(--gold2);

  border:1px solid #d9a45e55;

  padding:7px 13px;

  border-radius:30px;

  font-size:12px;

  margin-bottom:15px;
}

h1{

  font-size:
    clamp(
      35px,
      6vw,
      55px
    );

  margin:
    0 0 12px;

  line-height:1.2;
}

.author{

  color:var(--muted);

  font-size:15px;

  margin-bottom:25px;
}

.description{

  color:#d0c2b4;

  line-height:2;

  font-size:16px;

  max-width:650px;
}


/* PRICE */

.price-box{

  margin-top:30px;

  padding:20px;

  background:var(--card);

  border:1px solid var(--line);

  border-radius:15px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  flex-wrap:wrap;
}

.price{

  color:var(--gold2);

  font-size:25px;

  font-weight:900;
}


/* BUTTONS */

.buttons{

  display:flex;

  gap:10px;

  margin-top:20px;

  flex-wrap:wrap;
}

.btn{

  border:0;

  border-radius:11px;

  padding:13px 22px;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:#24170d;

  font-weight:900;

  cursor:pointer;
}

.btn.secondary{

  background:#ffffff0c;

  color:white;

  border:1px solid var(--line);
}


/* EXTRA */

.extra{

  margin-top:55px;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
}

.extra-card{

  background:var(--card);

  border:1px solid var(--line);

  border-radius:15px;

  padding:20px;

  text-align:center;
}

.extra-card b{

  display:block;

  margin-bottom:8px;
}

.extra-card span{

  color:var(--muted);

  font-size:12px;
}


/* FOOTER */

footer{

  border-top:1px solid var(--line);

  padding:30px;

  text-align:center;

  color:var(--muted);
}


/* MOBILE */

@media(max-width:750px){

  .book-details{

    grid-template-columns:1fr;

    gap:30px;

  }

  .cover{

    height:420px;

    max-width:300px;

    margin:auto;

  }

  .info{

    text-align:center;

  }

  .description{

    margin:auto;

  }

  .price-box{

    justify-content:center;

  }

  .buttons{

    justify-content:center;

  }

  .extra{

    grid-template-columns:1fr;

  }

}

</style></head><body><header><div class="logo">رواية حكاية

</footer><script>


/* =========================
   بيانات الروايات
========================= */

const books={


1:{

title:"ألف شمس ساطعة",

author:"خالد حسيني",

price:190,

category:"رومانسية",

description:
"حكاية تأخذك في رحلة مليئة بالمشاعر والتغيرات، وتضع الشخصيات أمام اختبارات صعبة."

},


2:{

description:
"رواية مليئة بالأسرار والأسئلة التي تدفعك لاكتشاف الحقيقة خطوة بعد خطوة."

},


3:{

title:"الرحلة",

author:"باسم خندقجي",

price:170,

category:"مغامرة",

cover:"",

description:
"رحلة مليئة بالأحداث والمواقف التي تغيّر مسار الحكاية."

},


4:{

title:"قواعد العشق الأربعون",

author:"إليف شافاق",

price:210,

category:"رومانسية",

cover:"",

description:
"حكاية تجمع بين الحب والفلسفة والبحث عن معنى مختلف للحياة."

},


5:{

title:"عندما يعزف الشيطان",

author:"منى الشاذلي",

price:180,

category:"رعب",

cover:"",

description:
"أحداث غامضة تأخذك إلى عالم مليء بالأسرار والتوتر."

},


6:{

title:"ليلة لا تنتهي",

author:"محمد صادق",

price:199,

category:"غموض",

cover:"",

description:
"ليلة واحدة يمكن أن تغيّر الكثير، وكل إجابة تفتح بابًا لسؤال جديد."

},


7:{

title:"1984",

author:"جورج أورويل",

price:160,

category:"كلاسيكيات",

cover:"",

description:
"عمل كلاسيكي يناقش السلطة والمراقبة والمجتمع بطريقة مؤثرة."

},


8:{

title:"مئة عام من العزلة",

author:"غابرييل غارسيا ماركيز",

price:220,

category:"كلاسيكيات",

cover:"",

description:
"عالم أدبي واسع مليء بالشخصيات والأحداث والخيال."

},


9:{

title:"الحصان الأسود",

author:"أحمد خالد توفيق",

price:150,

category:"غموض",

cover:"",

description:
"حكاية غامضة تحمل الكثير من المفاجآت."

},


10:{

title:"الأمير الصغير",

author:"أنطوان دو سانت",

price:140,

category:"فانتازيا",

cover:"",

description:
"رحلة خيالية تحمل أفكارًا بسيطة وعميقة في الوقت نفسه."

},


11:{

title:"تذكرة إلى سرمد",

author:"أحمد مراد",

price:190,

category:"مغامرة",

cover:"",

description:
"مغامرة جديدة مليئة بالأسرار والأحداث المتسارعة."

},


12:{

title:"رجال في الشمس",

author:"غسان كنفاني",

price:120,

category:"كلاسيكيات",

cover:"",

description:
"عمل أدبي كلاسيكي يحمل قصة إنسانية مؤثرة."

}

};


/* =========================
   قراءة ID
========================= */

const params=
new URLSearchParams(
window.location.search
);

const id=
Number(
params.get("id")
);


/* =========================
   اختيار الرواية
========================= */

const book=
books[id] || books[1];


/* =========================
   عرض البيانات
========================= */

document.title=
"Taleora | "+book.title;


document.getElementById("bookTitle")
.textContent=
book.title;


document.getElementById("bookAuthor")
.textContent=
"✍️ "+book.author;


document.getElementById("bookCategory")
.textContent=
book.category;


document.getElementById("extraCategory")
.textContent=
book.category;


document.getElementById("extraAuthor")
.textContent=
book.author;


document.getElementById("bookPrice")
.textContent=
book.price+" ج";


document.getElementById("bookDescription")
.textContent=
book.description;


/* =========================
   الغلاف
========================= */

if(book.cover){

document.getElementById("bookCover")
.src=
book.cover;

}else{

document.getElementById("bookCover")
.style.display="none";

}


/* =========================
   بدء القراءة
========================= */

function startReading(){

window.location.href=
"reader.html?id="+id;

}


/* =========================
   المفضلة
========================= */

function addToFavorites(){

let favorites=
JSON.parse(
localStorage.getItem("taleoraFavorites")
)||[];


if(!favorites.includes(id)){

favorites.push(id);

localStorage.setItem(
"taleoraFavorites",
JSON.stringify(favorites)
);

alert(
"تمت إضافة الرواية إلى المفضلة ❤️"
);

}else{

alert(
"الرواية موجودة بالفعل في المفضلة ❤️"
);

}

}


/* =========================
   الرئيسية
========================= */

function goHome(){

window.location.href=
"index.html";

}

</script></body></html>
