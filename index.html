<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taleora | عالمك بين صفحات الحكايات</title>
<style>
:root{
  --bg:#100d0b;
  --card:#191411;
  --gold:#d9a45e;
  --gold2:#f0c982;
  --text:#fff8ef;
  --muted:#b9aa9b;
  --line:#ffffff12;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;}

header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:15px;
  padding:14px 5%;background:#100d0bed;backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.logo{font-size:24px;font-weight:900;color:var(--gold2);cursor:pointer;}
.logo small{display:block;font-size:9px;letter-spacing:5px;color:#fff;text-align:center;}
.search{
  flex:1;max-width:450px;margin-right:auto;background:#ffffff09;
  border:1px solid #ffffff18;color:white;border-radius:30px;padding:12px 18px;outline:none;
}
.icon{background:none;border:0;color:white;font-size:21px;cursor:pointer;position:relative;}
#count{
  position:absolute;top:-5px;right:-8px;background:var(--gold);color:#000;
  font-size:10px;font-weight:bold;padding:2px 6px;border-radius:50%;
}

.hero{
  min-height:500px;display:flex;align-items:center;padding:70px 8%;
  background:linear-gradient(120deg, #100d0b, #25170e 55%, #0e0b09);
}
.hero h1{font-size:clamp(35px,5vw,65px);margin:0 0 20px;}
.hero h1 span{color:var(--gold2);}
.hero p{color:var(--muted);font-size:16px;line-height:1.8;}
.btn{
  border:0;border-radius:12px;padding:12px 22px;
  background:linear-gradient(135deg, var(--gold2), var(--gold));
  color:#24170d;font-weight:900;cursor:pointer;
}

section{width:90%;max-width:1200px;margin:50px auto;}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.section-title h2{font-size:24px;margin:0;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;}
.book{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:10px;cursor:pointer;transition:0.2s;
}
.book:hover{border-color:var(--gold);transform:translateY(-4px);}
.cover{
  height:210px;border-radius:10px;background:radial-gradient(circle, #52717c, #162329);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  font-weight:bold;position:relative;overflow:hidden;
}
.cover img{width:100%;height:100%;object-fit:cover;}
.fav-btn{
  position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);
  border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px;
}
.book h3{font-size:14px;margin:10px 0 5px;}
.author{color:var(--muted);font-size:11px;}
.book-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.price{color:var(--gold2);font-weight:bold;font-size:13px;}
.read-btn{background:var(--gold);border:none;padding:6px 10px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:11px;}

.drawer{
  position:fixed;inset:0 0 0 auto;width:320px;background:#17120f;z-index:100;
  padding:20px;box-shadow:-5px 0 25px #000;transform:translateX(110%);transition:0.3s;overflow:auto;
}
.drawer.open{transform:none;}
.close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;float:left;}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal.open{display:flex;}
.modal-content{background:var(--card);border-radius:15px;padding:20px;max-width:450px;width:100%;border:1px solid var(--line);}

footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <button class="icon" onclick="openMenu()">☰</button>
  <div class="logo" onclick="showAll()">TALEORA<small>عالم الحكايات</small></div>
  <input id="search" class="search" placeholder="ابحث عن رواية..." oninput="filterBooks()">
  <button class="icon" onclick="openCart()">🛒<span id="count">0</span></button>
</header>

<div class="hero">
  <div>
    <h1>كل حكاية لها بداية...<br><span>وكل رواية لها عالم.</span></h1>
    <p>اكتشف عوالم الخيال والغموض، واحفظ حكاياتك المفضلة بسهولة.</p>
    <button class="btn" onclick="document.getElementById('new').scrollIntoView()">تصفح الروايات</button>
  </div>
</div>

<section id="new">
  <div class="section-title"><h2>مكتبة الروايات</h2></div>
  <div class="grid" id="bookGrid"></div>
</section>

<footer>Taleora © 2026</footer>

<!-- القائمة الجانبية -->
<aside id="menuBox" class="drawer">
  <button class="close" onclick="closeMenu()">×</button>
  <h2>القائمة</h2>
  <ul style="list-style:none;padding:0;margin-top:20px;">
    <li style="margin-bottom:15px;"><a href="#" onclick="closeMenu(); showAll();" style="color:#fff;text-decoration:none;">الرئيسية</a></li>
    <li style="margin-bottom:15px;"><a href="#" onclick="closeMenu(); showFavorites();" style="color:#fff;text-decoration:none;">المفضلة ❤️</a></li>
  </ul>
</aside>

<!-- سلة المشتريات -->
<aside id="cartBox" class="drawer">
  <button class="close" onclick="closeCart()">×</button>
  <h2>سلة المشتريات</h2>
  <div id="cartItems" style="margin-top:15px;"></div>
  <hr style="border-color:var(--line);margin:15px 0;">
  <h3>الإجمالي: <span id="total">0</span> جنيه</h3>
  <button class="btn" style="width:100%;margin-top:10px;" onclick="checkout()">إتمام الطلب</button>
</aside>

<!-- تفاصيل الرواية -->
<div id="bookModal" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const books = [
  { id: 1, title: "ألف شمس ساطعة", author: "خالد حسيني", price: 190, desc: "رواية مؤثرة تأخذنا في رحلة عميقة داخل المجتمع الأفغاني." },
  { id: 2, title: "خريف البراءة", author: "أحمد مراد", price: 200, desc: "عمل تشويقي استثنائي يأخذك في عوالم الغموض وكشف الأسرار." },
  { id: 3, title: "الرحلة", author: "باسم خندقجي", price: 170, desc: "قصة مليئة بالتحديات والمغامرات الإنسانية العميقة." },
  { id: 4, title: "قواعد العشق الأربعون", author: "إليف شافاق", price: 210, desc: "رحلة صوفية تبحث عن الحب الحقيقي ومعاني الحياة والروح." }
];

let cart = [];

function render(list = books) {
  const grid = document.getElementById("bookGrid");
  let favs = JSON.parse(localStorage.getItem('favs')) || [];

  grid.innerHTML = list.map(b => {
    let isFav = favs.includes(b.id);
    return `
      <div class="book" onclick="openModal(${b.id})">
        <div class="cover">
          ${b.title}
          <button class="fav-btn" onclick="event.stopPropagation(); toggleFav(${b.id})" style="color:${isFav ? '#ff4757':'#fff'}">♥</button>
        </div>
        <h3>${b.title}</h3>
        <div class="author">${b.author}</div>
        <div class="book-bottom">
          <span class="price">${b.price} ج</span>
          <button class="read-btn" onclick="event.stopPropagation(); addToCart(${b.id})">أضف للسلة</button>
        </div>
      </div>
    `;
  }).join('');
}

function openModal(id) {
  let b = books.find(x => x.id === id);
  if(!b) return;
  document.getElementById("modalBody").innerHTML = `
    <h2 style="margin-top:0;">${b.title}</h2>
    <p style="color:var(--muted)">المؤلف: ${b.author}</p>
    <p style="line-height:1.6;">${b.desc}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
      <b style="color:var(--gold2);font-size:18px;">${b.price} جنيه</b>
      <button class="btn" onclick="addToCart(${b.id}); closeModal();">أضف للسلة</button>
    </div>
  `;
  document.getElementById("bookModal").classList.add("open");
}

function closeModal() {
  document.getElementById("bookModal").classList.remove("open");
}

function toggleFav(id) {
  let favs = JSON.parse(localStorage.getItem('favs')) || [];
  let idx = favs.indexOf(id);
  if(idx > -1) favs.splice(idx, 1);
  else favs.push(id);
  localStorage.setItem('favs', JSON.stringify(favs));
  render();
}

function showFavorites() {
  let favs = JSON.parse(localStorage.getItem('favs')) || [];
  render(books.filter(b => favs.includes(b.id)));
}

function showAll() {
  render(books);
}

function filterBooks() {
  let q = document.getElementById("search").value.toLowerCase();
  render(books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)));
}

function openMenu() { document.getElementById("menuBox").classList.add("open"); }
function closeMenu() { document.getElementById("menuBox").classList.remove("open"); }
function openCart() { document.getElementById("cartBox").classList.add("open"); }
function closeCart() { document.getElementById("cartBox").classList.remove("open"); }

function addToCart(id) {
  let b = books.find(x => x.id === id);
  if(b) {
    cart.push(b);
    updateCart();
    openCart();
  }
}

function updateCart() {
  document.getElementById("count").textContent = cart.length;
  document.getElementById("cartItems").innerHTML = cart.length ? cart.map((b, i) => `
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:5px;">
      <span>${b.title}</span>
      <div><b>${b.price}ج</b> <button onclick="cart.splice(${i},1);updateCart();" style="background:none;border:none;color:#ff4757;cursor:pointer;">×</button></div>
    </div>
  `).join('') : "<p style='color:var(--muted);text-align:center;'>السلة فارغة</p>";
  document.getElementById("total").textContent = cart.reduce((sum, b) => sum + b.price, 0);
}

function checkout() {
  if(cart.length === 0) return alert("السلة فارغة!");
  alert("تم إرسال الطلب بنجاح! ❤️");
  cart = [];
  updateCart();
  closeCart();
}

render();
</script>
</body>
</html>
