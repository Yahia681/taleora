<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Taleora | القراءة</title>

<style>

body{
  margin:0;
  background:#100d0b;
  color:#fff8ef;
  font-family:Tahoma,Arial,sans-serif;
}

header{
  padding:18px 6%;
  border-bottom:1px solid #ffffff18;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#f0c982;
  font-size:23px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
}

.back{
  background:#ffffff12;
  color:white;
}

.reader{
  max-width:800px;
  width:90%;
  margin:50px auto;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h1{
  font-size:35px;
}

.author{
  color:#f0c982;
}

.content{
  background:#191411;
  border:1px solid #ffffff12;
  border-radius:18px;
  padding:30px;
}

.chapter{
  text-align:center;
  color:#f0c982;
  font-size:22px;
  margin-bottom:30px;
}

.content p{
  color:#eee3d8;
  font-size:18px;
  line-height:2.2;
}

.next{
  display:block;
  margin:30px auto 0;
  background:#f0c982;
  color:#24170d;
  font-weight:bold;
}

footer{
  margin-top:80px;
  padding:30px;
  text-align:center;
  border-top:1px solid #ffffff12;
  color:#b9aa9b;
}

</style>

</head>

<body>

<header>

<div class="logo">
Taleora
</div>

<button
class="back"
onclick="history.back()"
>
← رجوع
</button>

</header>

<main class="reader">

<div class="title">

<h1 id="bookTitle">
جاري تحميل الرواية...
</h1>

<div
class="author"
id="bookAuthor"
>
</div>

</div>

<article class="content">

<div class="chapter">
الفصل الأول
</div>

<div id="story">

<p>
مرحبًا بك في عالم Taleora.
</p>

<p>
هذه صفحة القراءة الخاصة بالرواية.
يمكنك هنا قراءة فصول الرواية بشكل مريح ومنظم.
</p>

<p>
بدأت الحكاية، وكانت هناك أسرار كثيرة تنتظر أن يتم اكتشافها...
</p>

</div>

<button
class="next"
onclick="nextChapter()"
>
الفصل التالي ←
</button>

</article>

</main>

<footer>

Taleora © 2026

</footer>

<script>

const books = {

1:{
title:"ألف شمس ساطعة",
author:"خالد حسيني"
},

2:{
title:"خريف البراءة",
author:"أحمد مراد"
},

3:{
title:"الرحلة",
author:"باسم خندقجي"
},

4:{
title:"قواعد العشق الأربعون",
author:"إليف شافاق"
},

5:{
title:"عندما يعزف الشيطان",
author:"منى الشاذلي"
},

6:{
title:"ليلة لا تنتهي",
author:"محمد صادق"
},

7:{
title:"1984",
author:"جورج أورويل"
},

8:{
title:"مئة عام من العزلة",
author:"غابرييل غارسيا ماركيز"
},

9:{
title:"الحصان الأسود",
author:"أحمد خالد توفيق"
},

10:{
title:"الأمير الصغير",
author:"أنطوان دو سانت"
},

11:{
title:"تذكرة إلى سرمد",
author:"أحمد مراد"
},

12:{
title:"رجال في الشمس",
author:"غسان كنفاني"
}

};

const urlParams =
new URLSearchParams(
window.location.search
);

const bookId =
urlParams.get("id");

const book =
books[bookId];

if(book){

document.getElementById("bookTitle")
.textContent=book.title;

document.getElementById("bookAuthor")
.textContent=
"✍️ " + book.author;

}

else{

document.getElementById("bookTitle")
.textContent=
"الرواية غير موجودة";

}

let chapter=1;

function nextChapter(){

chapter++;

document.querySelector(".chapter")
.textContent=
"الفصل " + chapter;

document.getElementById("story")
.innerHTML=`

<p>
بدأ فصل جديد من الحكاية...
</p>

<p>
تتطور الأحداث وتظهر تفاصيل جديدة
تجعل القارئ يريد معرفة ما سيحدث بعد ذلك.
</p>

`;

}

</script>

</body>

</html>
